# Configuración de la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/healthyapp?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Indicar que el motor es MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MAGIA DE SPRING DATA JPA:
# "update" lee las clases @Entity (Paciente, Medida) y crea o actualiza las tablas automáticamente en la BD.
spring.jpa.hibernate.ddl-auto=update

# Mostrar las sentencias SQL ejecutadas en la consola de Java (opcional, muy útil)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false